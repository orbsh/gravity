[package]
name = "gravity-booth"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gravity-provider"
path = "src/bin/provider.rs"

[[bin]]
name = "gravity-turn"
path = "src/bin/turn.rs"

[dependencies]
aura-booth = { path = "../../../aura/crates/booth" }
aura-engine = { path = "../../../aura/crates/engine", default-features = false }
gravity-core = { path = "../core" }
induction-guest = { path = "../../../induction/crates/induction-guest" }
anyhow.workspace = true
serde_json.workspace = true
ureq = "2"

[dev-dependencies]
tempfile.workspace = true
mem-core = { path = "../../../krystallizer/crates/mem-core" }
mem-server = { path = "../../../krystallizer/crates/mem-server" }
axum = "0.8"
aura-engine = { path = "../../../aura/crates/engine", default-features = false }
aura-realm = { path = "../../../aura/crates/realm" }
induction-host = { path = "../../../induction/crates/induction-host" }
induction-protocol = { path = "../../../induction/crates/induction-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[lints]
workspace = true
